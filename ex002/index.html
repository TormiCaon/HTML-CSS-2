<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever um parágrafo de qualquer jeito.
    Basta colocar tudo no meio do par de tags &lt;p&gt; e &lt;/p&gt; <!-- lt=less than, gt=greater than-->
    </p>
    <p>Se precisar quebrar o texto em algum lugar específico <br> como esse, você pode usar a tag br.</p>
    <p>Vamos adicionar alguns símbolos especiais: 
    <dl> 
        <dfn>
            <abbr title="Marca registrada">&reg;</abbr>
            <abbr title="Copyright">&copy;</abbr>
            <abbr title="Marca comercial">&trade;</abbr>
            <abbr title="Euro">&euro;</abbr>
            <abbr title="Libra esterlina">&pound;</abbr>
            <abbr title="Iene japonês">&yen;</abbr>
            <abbr title="Cêntimo">&cent;</abbr>
            <abbr title="Letra delta">&Delta;&delta;</abbr>
            <abbr title="Seta para cima">&uparrow;</abbr>
            <abbr title="Seta para baixo">&downarrow;</abbr>
        </dfn>
    </dl> 
    </p>
</body>
</html>
