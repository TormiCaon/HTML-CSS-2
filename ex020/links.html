<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = children
        :) = happy
        */
        body { 
            font-family: Arial, Helvetica, sans-serif;
        }
        a { 
            color: rgb(255, 79, 79);
            text-decoration: none;
            font: bold;
        }
        a:visited { 
            color: rgb(207, 53, 53);
        }
        a:hover { 
            text-decoration: underline;
            color: black;
        }
        a:active { 
            color: yellow;
        }
        a:after { 
            content:' 🔗';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
        .especial::before{ 
            content: "→";
        }
        .especial::after{
            content: "←";
        }
        .especial { 
            background-color: rgb(209, 69, 69);
            color: white;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a target="_blank" href="https://gustavoguanabara.github.io">Repositório Github</a></li>
        <li><a class="especial" target="_blank" href="https://yotube.com/cursoemvideo/">Canal do YouTube</a></li>
        <li><a target="_blank" href="https://www.cursoemvideo.com">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
