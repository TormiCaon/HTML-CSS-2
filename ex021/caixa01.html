<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
       h1 { 
        display: block;
        background-color: lightgray;
        height: 300px;
        width: 300px;
        border: 3px dotted black;
        padding: 10px;
        

        /*sentido horario v*/

        margin: auto;
        margin-bottom: 25px;
        outline: 2px solid black;

       } /*largura, estilo, cor v*/

       a { 
        display: block;
        border: 2px dashed red;
        margin: 5px;
       }
    </style>
</head>
<body>
    <h1>Exemplos de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links também são exemplos de caixas inline-level</a>. Vamos ver como isso tudo funciona.
    </p>
</body>
</html>
